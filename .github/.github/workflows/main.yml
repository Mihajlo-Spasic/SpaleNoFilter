name: Main — Test, Build & Push

# Triggers on every push (commit) to the main branch.
# Runs unit tests first; only builds and pushes Docker images if tests pass.
on:
  push:
    branches:
      - main

env:
  # Change DOCKER_USERNAME to your Docker Hub username (or org).
  # Set DOCKERHUB_TOKEN as a repository secret in GitHub → Settings → Secrets.
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Unit tests (same as PR check — must pass before images are built)
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/go.mod
          cache: true
          cache-dependency-path: tests/go.sum

      - name: Download test dependencies
        working-directory: tests
        run: go mod download

      - name: Run unit tests
        working-directory: tests
        run: |
          go test ./... \
            -run '^Test[^I]' \
            -v \
            -timeout 120s \
            -count=1
        env:
          INTERNAL_SECRET: internal-service-to-service-secret-key

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker images and push to Docker Hub
  # Runs only when unit-tests passes.
  # Each service gets two tags:
  #   - yyyymmdd-hhmmss  (timestamp of this exact build)
  #   - latest
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: unit-tests

    strategy:
      # Build all 6 services in parallel to minimise total wall-clock time.
      # If one service fails to build the others still complete.
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./auth-service
          - service: user-service
            context: ./user-service
          - service: social-service
            context: ./social-service
          - service: post-service
            context: ./post-service
          - service: interaction-service
            context: ./interaction-service
          - service: feed-service
            context: ./feed-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Generate the timestamp tag in the required format: yyyymmdd-hhmmss
      # We capture it into GITHUB_ENV so subsequent steps can reference it.
      - name: Generate image tag
        id: tag
        run: |
          TAG=$(date -u +'%Y%m%d-%H%M%S')
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # Enable multi-platform builds and layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image and push both the timestamp tag and latest.
      # Layer cache is stored in the GitHub Actions cache to speed up rebuilds.
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

      - name: Print pushed image tags
        run: |
          echo "✅ Pushed ${{ matrix.service }}"
          echo "   ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
          echo "   ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest"
