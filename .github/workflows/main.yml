name: Main — Test, Build & Push

on:
  push:
    branches:
      - main

env:
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tests/go.mod
          cache: true
          cache-dependency-path: tests/go.sum

      - name: Download test dependencies
        working-directory: tests
        run: go mod download

      - name: Run unit tests
        working-directory: tests
        run: |
          go test ./... \
            -run '^Test[^I]' \
            -v \
            -timeout 120s \
            -count=1
        env:
          INTERNAL_SECRET: internal-service-to-service-secret-key

  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: unit-tests

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./auth-service
          - service: user-service
            context: ./user-service
          - service: social-service
            context: ./social-service
          - service: post-service
            context: ./post-service
          - service: interaction-service
            context: ./interaction-service
          - service: feed-service
            context: ./feed-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          TAG=$(date -u +'%Y%m%d-%H%M%S')
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

      - name: Print pushed image tags
        run: |
          echo "Pushed ${{ matrix.service }}"
          echo "   ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}"
          echo "   ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest"
