<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ── Toast notification ─────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     AUTH SCREEN
════════════════════════════════════════════════════════════════════════════ -->
<div id="auth">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>Lumina</h1>
      <p>Share your world</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab on" onclick="authTab('login')">Sign In</div>
      <div class="auth-tab"    onclick="authTab('reg')">Create Account</div>
    </div>

    <!-- Login form -->
    <div id="login-form">
      <div id="login-error" class="error-msg" style="display:none"></div>
      <div class="form-group">
        <label>Username or Email</label>
        <input id="login-identifier" type="text" placeholder="your_username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="login-password" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary full" onclick="doLogin()">Sign In</button>
    </div>

    <!-- Register form -->
    <div id="register-form" style="display:none">
      <div id="register-error" class="error-msg" style="display:none"></div>
      <div class="form-group">
        <label>Username</label>
        <input id="reg-username" type="text" placeholder="johndoe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="john@example.com">
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input id="reg-fullname" type="text" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="reg-password" type="password" placeholder="Min. 8 characters">
      </div>
      <button class="btn btn-primary full" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>
