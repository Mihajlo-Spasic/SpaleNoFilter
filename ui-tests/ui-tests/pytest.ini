[pytest]
# Run test files in this order so auth runs first (creates session users),
# then posts (needs logged-in user), then social, then profile (deletion last).
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output + short traceback for readability
addopts =
    -v
    --tb=short
    --html=report.html
    --self-contained-html

# Stop after first failure by default — remove -x if you want all results
# addopts = -v --tb=short -x

log_cli = true
log_cli_level = INFO
